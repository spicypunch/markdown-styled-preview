name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Lint
        run: npm run lint

      - name: Build macOS zip
        run: npm run dist:mac

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Markdown-Styled-Preview-macOS
          path: release/*.zip
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/*.zip --clobber
          else
            gh release create "$TAG_NAME" release/*.zip --generate-notes
          fi
